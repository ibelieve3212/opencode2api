name: Release binaries and GHCR image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      image_name: ${{ steps.metadata.outputs.image_name }}
    steps:
      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be a semantic version such as v1.0.0 or v1.0.0-rc.1" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          # A package name the registry accepts. GITHUB_REPOSITORY would give opencode2api, and a
          # package by that name under this account refuses this repository with write_package, while
          # a fresh name in the same job pushes normally.
          echo "image_name=ghcr.io/${IMAGE_OWNER}/oc2api" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            extension: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            extension: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            extension: .exe
            archive: zip
          - goos: darwin
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            extension: ""
            archive: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare package name
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          package_name="opencode2api_${RELEASE_TAG}_${{ matrix.goos }}_${{ matrix.goarch }}"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          mkdir -p "dist/$PACKAGE_NAME"
          go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "dist/$PACKAGE_NAME/opencode2api$EXTENSION" ./cmd/opencode2api
          # 池子与出口对比工具跟主程序一起发，版本天然对齐。
          go build -trimpath -ldflags="-s -w" -o "dist/$PACKAGE_NAME/poolproxy$EXTENSION" ./cmd/poolproxy
          go build -trimpath -ldflags="-s -w" -o "dist/$PACKAGE_NAME/exitprobe$EXTENSION" ./cmd/exitprobe
          cp README.md README.zh-CN.md README.vi.md README.it.md LICENSE config.example.json "dist/$PACKAGE_NAME/"
          cp -r docs "dist/$PACKAGE_NAME/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            (cd dist && zip -q -r "$PACKAGE_NAME.zip" "$PACKAGE_NAME")
            archive="$PACKAGE_NAME.zip"
          else
            tar -C dist -czf "dist/$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"
            archive="$PACKAGE_NAME.tar.gz"
          fi
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.package_name }}
          path: |
            dist/${{ steps.metadata.outputs.package_name }}.${{ matrix.archive }}
            dist/${{ steps.metadata.outputs.package_name }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  container:
    name: Build image ${{ matrix.arch }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    # A native runner per architecture rather than one QEMU build. The reference project in this
    # account publishes this way, and on a public repository both runner families are free.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push this architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # A per-architecture tag for the merge job to assemble.
          tags: ${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.release_tag }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.release_tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # No attestation is published. The reference sets provenance false and no sbom, and
          # keeping this identical is the whole point of the change.
          provenance: false

  container-merge:
    name: Merge the image manifest
    needs: [prepare, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.release_tag }}
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.release_tag }},enable=${{ !contains(needs.prepare.outputs.release_tag, '-') }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.release_tag }},enable=${{ !contains(needs.prepare.outputs.release_tag, '-') }}
          labels: |
            org.opencontainers.image.title=opencode2api
            org.opencontainers.image.description=OpenAI-compatible API gateway for OpenCode Zen and Go
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Assemble the multi-architecture manifest
        shell: bash
        env:
          BASE: ${{ needs.prepare.outputs.image_name }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          amd64="${BASE}:${RELEASE_TAG}-amd64"
          arm64="${BASE}:${RELEASE_TAG}-arm64"

          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args="${tag_args} -t ${tag}"
          done <<< "${TAGS}"

          if [ -z "${tag_args}" ]; then
            echo "no tags were produced; refusing to continue" >&2
            exit 1
          fi

          echo "merging ${amd64} and ${arm64}"
          # shellcheck disable=SC2086
          docker buildx imagetools create ${tag_args} "${amd64}" "${arm64}"

      - name: Verify both architectures are present
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          first="$(printf '%s\\n' "${TAGS}" | head -n 1)"
          echo "inspecting ${first}"
          docker buildx imagetools inspect "${first}" | tee /tmp/inspect.txt
          # A merge that silently produced one architecture would otherwise pass.
          grep -q "linux/amd64" /tmp/inspect.txt
          grep -q "linux/arm64" /tmp/inspect.txt
          echo "the manifest carries amd64 and arm64"

  release:
    name: Publish GitHub Release
    # The container job is deliberately not a dependency. The binaries and the image are
    # separate deliverables, and a registry refusal — which GHCR applies to the first publish of
    # a package under a personal account — must not withhold six successfully built binaries.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: opencode2api_*
          path: release-files
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          release_type=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_type+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-files/* "${release_type[@]}" --generate-notes --title "$RELEASE_TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
